
<div class="predict-form">
    <h2>Predictive Maintenance Form</h2>
    <form (ngSubmit)="onSubmit()">

        <label for="type">Type (0=Low, 1=Medium, 2=High):</label>
        <input type="number" id="type" [(ngModel)]="type" name="type" min="0" max="2" required>

        <label for="airTemperature">Air Temperature (K):</label>
        <input type="number" id="airTemperature" [(ngModel)]="airTemperature" name="airTemperature" step="0.1">

        <label for="processTemperature">Process Temperature (K):</label>
        <input type="number" id="processTemperature" [(ngModel)]="processTemperature" name="processTemperature" step="0.1">

        <label for="rotationalSpeed">Rotational Speed (rpm):</label>
        <input type="number" id="rotationalSpeed" [(ngModel)]="rotationalSpeed" name="rotationalSpeed" step="0.1">

        <label for="torque">Torque (N·m):</label>
        <input type="number" id="torque" [(ngModel)]="torque" name="torque" step="0.1">

        <label for="toolWear">Tool Wear (min):</label>
        <input type="number" id="toolWear" [(ngModel)]="toolWear" name="toolWear" step="0.1">

        <button type="submit">Check Risk</button>

    </form>

    <div *ngIf="riskResult !== null" class="result">
        <p>Failure Risk: <strong>{{ riskResult }}</strong></p>
    </div>

</div>
